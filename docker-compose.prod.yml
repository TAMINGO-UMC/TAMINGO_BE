version: "3.9"

services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    image: heezuko/tamingo-backend:latest
    container_name: tamingo-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: tamingo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - tamingo_redisdata:/data

volumes:
  tamingo_redisdata: